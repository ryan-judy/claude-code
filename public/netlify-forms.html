<!DOCTYPE html>
<html>
<head><title>Netlify Form Registration</title></head>
<body>
  <!-- Contact form pre-registration for Netlify Forms bot -->
  <form name="contact" data-netlify="true" netlify hidden>
    <input name="firstName" type="text" />
    <input name="lastName" type="text" />
    <input name="email" type="email" />
    <input name="company" type="text" />
    <input name="website" type="url" />
    <input name="service" type="text" />
    <textarea name="message"></textarea>
    <input name="wantAudit" type="checkbox" />
  </form>

  <!-- Audit form pre-registration for Netlify Forms bot -->
  <form name="audit" data-netlify="true" netlify hidden>
    <input name="name" type="text" />
    <input name="email" type="email" />
    <input name="business" type="text" />
    <input name="url" type="url" />
    <textarea name="description"></textarea>
    <select name="challenge"></select>
  </form>
</body>
</html>
